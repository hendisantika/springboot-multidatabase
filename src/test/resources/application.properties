# Test configuration: both datasources run on in-memory H2 so the build does not need real MySQL / SQL Server.
spring.datasource.url=jdbc:h2:mem:mysqldb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
sqlserver.datasource.url=jdbc:h2:mem:sqlserverdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
sqlserver.datasource.username=sa
sqlserver.datasource.password=
sqlserver.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.auto=create-drop
spring.jpa.show-sql=false
